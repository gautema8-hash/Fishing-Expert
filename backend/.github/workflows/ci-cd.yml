name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 构建与测试
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: 编译项目
        run: mvn clean compile -B -q

      - name: 运行单元测试
        run: mvn test -B

      - name: 打包应用
        run: mvn package -DskipTests -B -q

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fishing-backend-jar
          path: target/fishing-backend.jar
          retention-days: 7

  # 代码质量检查
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: 代码风格检查
        run: |
          echo "=== 检查System.out.println ==="
          if grep -r "System.out.println" src/main/java --include="*.java" | grep -v "FishingApplication"; then
            echo "发现System.out.println，请使用日志"
            exit 1
          fi
          echo "通过"

      - name: 检查文件编码
        run: |
          echo "=== 检查BOM ==="
          if find src -name "*.java" -exec file {} \; | grep -i "BOM"; then
            echo "发现BOM编码文件"
            exit 1
          fi
          echo "通过"

  # 部署到测试环境
  deploy-staging:
    name: 部署到测试环境
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: fishing-backend-jar

      - name: 部署到测试服务器
        run: |
          echo "部署到测试环境..."
          echo "JAR文件: $(ls -la fishing-backend.jar)"
          # 实际部署时替换为SSH/SCP部署脚本
