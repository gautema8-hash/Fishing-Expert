<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虾堡捕鱼达人管理后台</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-logo">🦐 虾堡捕鱼达人</div>
        <nav class="sidebar-nav">
            <div class="nav-item active" data-page="dashboard"><span>📊</span><span class="lbl">仪表盘</span></div>
            <div class="nav-item" data-page="players"><span>👤</span><span class="lbl">玩家管理</span></div>
            <div class="nav-item" data-page="orders"><span>📦</span><span class="lbl">订单管理</span></div>
            <div class="nav-item" data-page="mail"><span>✉️</span><span class="lbl">邮件管理</span></div>
            <div class="nav-item" data-page="announcements"><span>📢</span><span class="lbl">公告管理</span></div>
            <div class="nav-item" data-page="redemption"><span>🎟️</span><span class="lbl">兑换码管理</span></div>
            <div class="nav-item" data-page="logs"><span>📝</span><span class="lbl">操作日志</span></div>
            <div class="nav-item" data-page="config"><span>⚙️</span><span class="lbl">系统配置</span></div>
        </nav>
    </aside>

    <!-- 主区域 -->
    <div class="main-wrap">
        <header class="topbar">
            <div class="topbar-title">虾堡捕鱼达人管理后台</div>
            <div class="topbar-right">
                <span class="time-display" id="currentTime" style="color:#36E0E8;font-family:monospace;font-size:13px;">--:--:--</span>
                <span class="admin-name" id="adminName">--</span>
                <button class="btn btn-sm btn-danger" id="logoutBtn">退出登录</button>
            </div>
        </header>

        <main class="content">
            <div class="page active" id="page-dashboard"></div>
            <div class="page" id="page-players"></div>
            <div class="page" id="page-orders"></div>
            <div class="page" id="page-mail"></div>
            <div class="page" id="page-announcements"></div>
            <div class="page" id="page-redemption"></div>
            <div class="page" id="page-logs"></div>
            <div class="page" id="page-config"></div>
        </main>

        <footer class="footer">
            虾堡捕鱼达人管理后台 © 2026 | 游戏内金币为纯游戏虚拟道具，不可兑换现金，仅游戏内部消耗使用
        </footer>
    </div>
</div>

<script src="lib/echarts.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/players.js"></script>
<script src="js/orders.js"></script>
<script src="js/mail.js"></script>
<script src="js/announcements.js"></script>
<script src="js/redemption.js"></script>
<script src="js/logs.js"></script>
<script src="js/config.js"></script>
</body>
</html>
